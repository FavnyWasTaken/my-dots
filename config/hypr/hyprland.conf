env = QT_QPA_PLATFORMTHEME,qt6ct
env = XCURSOR_THEME,silver-wolf-honkai-cursors
env = XCURSOR_SIZE,24
exec-once = hyprctl setcursor silver-wolf-honkai-cursors 24
